<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="'Courier New',Courier,monospace" role="img" aria-label="High-fidelity mockup of the Daily Genus puzzle, mid-round, showing the revealed classification tree and four guesses">
  <style>
    .h{font-size:15px;fill:#1f2b38;font-weight:700}
    .lbl{font-size:12px;fill:#52606e}
    .val{font-size:13px;fill:#33424f}
    .hi{font-size:13px;fill:#1f2b38}
    .faint{font-size:11.5px;fill:#5b6773}
    .id{font-size:9.5px;fill:#5f6a75}
    .it{font-style:italic}
  </style>

  <rect width="1200" height="940" fill="#e9eef2"/>

  <!-- TOP BAR -->
  <rect x="0" y="0" width="1200" height="58" fill="#ffffff"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#cfd8de"/>
  <rect x="24" y="13" width="150" height="32" rx="16" fill="none" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="46" y="34" class="val" font-size="12.5" fill="#0a7f66">←  Back to map</text>
  <text x="192" y="37" class="faint">Map / <tspan fill="#33424f">Daily Genus</tspan></text>
  <text x="1176" y="30" class="faint" text-anchor="end">Classification per PBDB snapshot · 26 Jul 2026</text>
  <text x="1176" y="46" class="id" text-anchor="end">SPEC-019 UX-004</text>

  <!-- HEADER -->
  <text x="24" y="104" font-size="26" font-weight="700" fill="#1f2b38">Daily Genus No. 128</text>
  <text x="24" y="130" class="lbl">One genus a day, the same for everyone. Each guess tells you</text>
  <text x="24" y="148" class="lbl">the deepest clade you share with it.</text>
  <text x="24" y="170" class="val">4 of 8 guesses used</text>

  <rect x="892" y="82" width="284" height="62" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="912" y="106" class="lbl">Next puzzle in</text>
  <text x="1156" y="107" font-size="20" font-weight="700" fill="#1f2b38" text-anchor="end">06:12:44</text>
  <text x="912" y="130" class="faint">Resets 00:00 UTC</text>
  <text x="1176" y="164" class="id" text-anchor="end">SPEC-019 REQ-001 · REQ-009</text>

  <!-- ================= LEFT PANEL — REVEALED TREE ================= -->
  <rect x="24" y="188" width="616" height="728" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="48" y="220" class="h">What you know</text>
  <text x="616" y="220" class="id" text-anchor="end">SPEC-019 REQ-005 · REQ-014</text>
  <text x="48" y="240" class="faint">Confirmed ancestors of the answer, and what you ruled out.</text>
  <line x1="48" y1="252" x2="616" y2="252" stroke="#dde5ea"/>

  <!-- spine connectors -->
  <line x1="54" y1="284" x2="54" y2="304" stroke="#cdd9e0" stroke-width="1.5"/>
  <line x1="68" y1="328" x2="68" y2="348" stroke="#cdd9e0" stroke-width="1.5"/>
  <line x1="82" y1="372" x2="82" y2="392" stroke="#cdd9e0" stroke-width="1.5"/>
  <line x1="96" y1="416" x2="96" y2="436" stroke="#cdd9e0" stroke-width="1.5"/>
  <line x1="110" y1="460" x2="110" y2="480" stroke="#cdd9e0" stroke-width="1.5"/>
  <line x1="124" y1="504" x2="124" y2="524" stroke="#cdd9e0" stroke-width="1.5"/>
  <line x1="138" y1="548" x2="138" y2="568" stroke="#cdd9e0" stroke-width="1.5"/>
  <line x1="152" y1="592" x2="152" y2="614" stroke="#cdd9e0" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- confirmed spine · filled dot, clade tint reinforces the name -->
  <circle cx="54" cy="278" r="5.5" fill="#b4bcc6" stroke="#8b96a3"/>
  <text x="70" y="282" class="hi" font-weight="700">Dinosauria <tspan class="faint" font-weight="400">clade · root</tspan></text>

  <circle cx="68" cy="322" r="5.5" fill="#dc9a80" stroke="#b9765c"/>
  <text x="84" y="326" class="hi">Theropoda <tspan class="faint">clade</tspan></text>

  <circle cx="82" cy="366" r="5.5" fill="#dc9a80" stroke="#b9765c"/>
  <text x="98" y="370" class="hi">Neotheropoda <tspan class="faint">clade</tspan></text>

  <circle cx="96" cy="410" r="5.5" fill="#dc9a80" stroke="#b9765c"/>
  <text x="112" y="414" class="hi">Averostra <tspan class="faint">clade</tspan></text>

  <circle cx="110" cy="454" r="5.5" fill="#dc9a80" stroke="#b9765c"/>
  <text x="126" y="458" class="hi">Tetanurae <tspan class="faint">clade</tspan></text>

  <circle cx="124" cy="498" r="5.5" fill="#dc9a80" stroke="#b9765c"/>
  <text x="140" y="502" class="hi">Coelurosauria <tspan class="faint">clade</tspan></text>

  <circle cx="138" cy="542" r="5.5" fill="#dc9a80" stroke="#b9765c"/>
  <text x="154" y="546" class="hi">Tyrannosauroidea <tspan class="faint">clade</tspan></text>

  <circle cx="152" cy="586" r="5.5" fill="#dc9a80" stroke="#b9765c"/>
  <text x="168" y="590" class="hi" font-weight="700">Tyrannosauridae <tspan class="faint" font-weight="400">family</tspan></text>

  <!-- unresolved continuation -->
  <circle cx="166" cy="624" r="6.5" fill="#ffffff" stroke="#8b96a3" stroke-dasharray="3 3"/>
  <text x="182" y="628" class="lbl">?  the answer is somewhere below</text>
  <text x="48" y="656" class="faint">No depth and no distance are given — working out how</text>
  <text x="48" y="672" class="faint">specific the answer is, is part of the puzzle.</text>
  <text x="616" y="672" class="id" text-anchor="end">SPEC-019 REQ-004</text>

  <!-- ruled-out branches -->
  <line x1="60" y1="278" x2="366" y2="278" stroke="#e3e9ee" stroke-dasharray="2 3"/>
  <rect x="372" y="266" width="236" height="24" rx="12" fill="#f2f5f7" stroke="#d7dee4"/>
  <text x="386" y="282" class="faint">✕ <tspan text-decoration="line-through">Ornithischia</tspan> · Triceratops</text>

  <line x1="60" y1="302" x2="366" y2="302" stroke="#e3e9ee" stroke-dasharray="2 3"/>
  <rect x="372" y="290" width="236" height="24" rx="12" fill="#f2f5f7" stroke="#d7dee4"/>
  <text x="386" y="306" class="faint">✕ <tspan text-decoration="line-through">Saurischia</tspan> · Diplodocus</text>

  <line x1="130" y1="498" x2="366" y2="498" stroke="#e3e9ee" stroke-dasharray="2 3"/>
  <rect x="372" y="486" width="236" height="24" rx="12" fill="#f2f5f7" stroke="#d7dee4"/>
  <text x="386" y="502" class="faint">✕ <tspan text-decoration="line-through">Maniraptora</tspan> · Velociraptor</text>

  <line x1="158" y1="586" x2="366" y2="586" stroke="#e3e9ee" stroke-dasharray="2 3"/>
  <rect x="372" y="574" width="236" height="24" rx="12" fill="#f2f5f7" stroke="#d7dee4"/>
  <text x="386" y="590" class="faint">✕ <tspan text-decoration="line-through">Albertosaurinae</tspan> · Gorgosaurus</text>

  <!-- the no-siblings rule, as product copy -->
  <line x1="48" y1="692" x2="616" y2="692" stroke="#dde5ea"/>
  <text x="48" y="716" class="faint">Only branches your guesses have touched are shown. Sibling</text>
  <text x="48" y="734" class="faint">clades are never listed, so the tree cannot hand you the</text>
  <text x="48" y="752" class="faint">answer by elimination.</text>

  <!-- legend — shape carries the state, tint only reinforces -->
  <line x1="48" y1="772" x2="616" y2="772" stroke="#dde5ea"/>
  <text x="48" y="798" class="lbl" font-weight="700">Reading the tree</text>
  <circle cx="56" cy="822" r="5.5" fill="#dc9a80" stroke="#b9765c"/>
  <text x="72" y="826" class="faint">Filled — a confirmed ancestor. Tint = clade, as on the map.</text>
  <text x="52" y="852" class="faint">✕</text>
  <text x="72" y="852" class="faint">Struck through — ruled out, and by which guess.</text>
  <circle cx="56" cy="872" r="5.5" fill="#ffffff" stroke="#8b96a3" stroke-dasharray="3 3"/>
  <text x="72" y="876" class="faint">Dashed — unresolved; the descent continues below.</text>
  <text x="72" y="900" class="faint">Every state is named in words, never by colour alone.</text>
  <text x="616" y="900" class="id" text-anchor="end">SPEC-019 UX-003</text>

  <!-- ================= RIGHT PANEL — GUESSES ================= -->
  <rect x="664" y="188" width="512" height="728" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="688" y="220" class="h">Your guesses</text>
  <text x="1152" y="220" class="id" text-anchor="end">SPEC-019 REQ-003 · REQ-004</text>

  <!-- guess input -->
  <rect x="688" y="236" width="352" height="40" rx="6" fill="#ffffff" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="704" y="261" class="lbl">Type a genus…</text>
  <rect x="1048" y="236" width="104" height="40" rx="6" fill="#0a7f66"/>
  <text x="1100" y="261" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Guess</text>
  <text x="688" y="294" class="faint">Genera only — 1,492 are guessable.</text>

  <line x1="688" y1="308" x2="1152" y2="308" stroke="#dde5ea"/>

  <!-- guess 1 -->
  <text x="688" y="338" class="faint">1</text>
  <text x="712" y="338" class="hi it">Triceratops</text>
  <text x="712" y="358" class="lbl">shares <tspan fill="#1f2b38" font-weight="700">Dinosauria</tspan> · clade</text>
  <rect x="1010" y="322" width="142" height="22" rx="11" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="1081" y="337" class="faint" text-anchor="middle">≈ time overlaps</text>
  <line x1="688" y1="374" x2="1152" y2="374" stroke="#eef2f5"/>

  <!-- guess 2 -->
  <text x="688" y="404" class="faint">2</text>
  <text x="712" y="404" class="hi it">Diplodocus</text>
  <text x="712" y="424" class="lbl">shares <tspan fill="#1f2b38" font-weight="700">Dinosauria</tspan> · clade</text>
  <rect x="1010" y="388" width="142" height="22" rx="11" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="1081" y="403" class="faint" text-anchor="middle">↓ answer younger</text>
  <line x1="688" y1="440" x2="1152" y2="440" stroke="#eef2f5"/>

  <!-- guess 3 -->
  <text x="688" y="470" class="faint">3</text>
  <text x="712" y="470" class="hi it">Velociraptor</text>
  <text x="712" y="490" class="lbl">shares <tspan fill="#1f2b38" font-weight="700">Coelurosauria</tspan> · clade</text>
  <rect x="1010" y="454" width="142" height="22" rx="11" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="1081" y="469" class="faint" text-anchor="middle">≈ time overlaps</text>
  <line x1="688" y1="506" x2="1152" y2="506" stroke="#eef2f5"/>

  <!-- guess 4 — the one that advanced the tree -->
  <rect x="672" y="516" width="496" height="76" rx="6" fill="#f2faf7"/>
  <rect x="672" y="516" width="3" height="76" fill="#0f9d83"/>
  <text x="688" y="542" class="faint">4</text>
  <text x="712" y="542" class="hi it" font-weight="700">Gorgosaurus</text>
  <text x="712" y="562" class="lbl">shares <tspan fill="#1f2b38" font-weight="700">Tyrannosauridae</tspan> · family</text>
  <text x="712" y="582" class="faint" fill="#0a7f66">▲ advanced the tree</text>
  <rect x="1010" y="526" width="142" height="22" rx="11" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="1081" y="541" class="faint" text-anchor="middle">≈ time overlaps</text>

  <!-- time clue -->
  <line x1="688" y1="618" x2="1152" y2="618" stroke="#dde5ea"/>
  <text x="688" y="646" class="lbl" font-weight="700">Time</text>
  <text x="1152" y="646" class="id" text-anchor="end">SPEC-019 REQ-006</text>
  <rect x="688" y="660" width="142" height="24" rx="12" fill="#eaf3ec" stroke="#a9cdb0"/>
  <circle cx="704" cy="672" r="4.5" fill="#5fa96a"/>
  <text x="716" y="677" class="faint" fill="#33424f">Cretaceous</text>
  <text x="844" y="677" class="faint">guess 1 overlapped it</text>
  <text x="688" y="706" class="faint">Older, younger or overlapping — never a number and</text>
  <text x="688" y="724" class="faint">never a blank. No time span reads “Not available”.</text>

  <!-- hint -->
  <line x1="688" y1="744" x2="1152" y2="744" stroke="#dde5ea"/>
  <rect x="688" y="762" width="300" height="38" rx="6" fill="#f2f5f7" stroke="#d7dee4"/>
  <text x="708" y="786" class="faint" fill="#5b6773">Reveal silhouette — from guess 5</text>
  <text x="688" y="822" class="faint">Optional, never automatic. Marked in your result.</text>
  <text x="1152" y="822" class="id" text-anchor="end">SPEC-019 REQ-008</text>

  <!-- practice -->
  <line x1="688" y1="840" x2="1152" y2="840" stroke="#dde5ea"/>
  <text x="688" y="866" class="lbl" font-weight="700">Want another round?</text>
  <rect x="688" y="878" width="200" height="34" rx="6" fill="#ffffff" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="788" y="900" class="val" font-size="12.5" fill="#0a7f66" text-anchor="middle">Play a practice round</text>
  <text x="900" y="900" class="faint">does not touch today’s</text>
  <text x="1152" y="866" class="id" text-anchor="end">SPEC-019 REQ-010</text>
</svg>

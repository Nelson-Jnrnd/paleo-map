<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Wireframe of a taxon profile screen">
  <style>
    .h1{font-size:24px;font-weight:700;font-style:italic;fill:#2b2b28}
    .eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:700;fill:#8a857a}
    .lbl{font-size:12px;fill:#6f6b62}
    .val{font-size:12px;fill:#2b2b28}
    .valb{font-size:12px;font-weight:700;fill:#2b2b28}
    .mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:9.5px;fill:#5f7891}
    .card{fill:#ffffff;stroke:#d8d5cd;stroke-width:1}
    .chip{fill:#f0efe9;stroke:#d8d5cd;stroke-width:1}
    .ph{fill:#eceae4}
    .badge{fill:#f0e4d2;stroke:#cdaa72;stroke-width:1}
    .acctxt{fill:#b07a35;font-size:12px;font-weight:700}
    .dashed{fill:#f4f2ec;stroke:#c9c6bf;stroke-width:1.5;stroke-dasharray:5 4}
  </style>

  <rect width="1040" height="760" fill="#f6f5f2"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1040" height="56" fill="#ffffff" stroke="#d8d5cd"/>
  <rect x="24" y="14" width="140" height="28" rx="14" class="badge"/>
  <text x="40" y="32" class="acctxt">←  Back to map</text>
  <text x="174" y="32" class="mono">FONC-1000 · FONC-1080 (≤1 action)</text>
  <text x="1016" y="32" class="lbl" text-anchor="end">Age &amp; filters preserved · FONC-1010/1020</text>

  <!-- Header -->
  <rect x="16" y="72" width="1008" height="88" rx="8" class="card"/>
  <text x="32" y="112" class="h1">Allosaurus fragilis</text>
  <rect x="266" y="94" width="64" height="22" rx="11" class="chip"/>
  <text x="298" y="109" class="lbl" text-anchor="middle">Species</text>
  <rect x="338" y="94" width="96" height="22" rx="11" class="chip"/>
  <text x="386" y="109" class="lbl" text-anchor="middle">Short profile</text>
  <rect x="442" y="94" width="132" height="22" rx="11" class="badge"/>
  <text x="508" y="109" class="acctxt" font-size="11" text-anchor="middle">◐ Incomplete profile</text>
  <text x="32" y="140" class="lbl">Non-avian dinosaur · <tspan class="valb">Main content</tspan></text>
  <text x="1008" y="112" class="mono" text-anchor="end">FONC-520 · FONC-530</text>
  <text x="1008" y="140" class="mono" text-anchor="end">FONC-430 · FONC-480 · FONC-410</text>

  <!-- LEFT COLUMN -->
  <rect x="16" y="172" width="496" height="572" rx="8" class="card"/>
  <text x="32" y="196" class="eyebrow">CLASSIFICATION</text>
  <text x="496" y="196" class="mono" text-anchor="end">FONC-540 · FONC-690 · FONC-710</text>
  <g>
    <text x="32" y="222" class="val">Dinosauria <tspan class="lbl">· clade</tspan></text>
    <text x="48" y="244" class="val">› Saurischia <tspan class="lbl">· clade</tspan></text>
    <text x="64" y="266" class="val">› Theropoda <tspan class="lbl">· clade</tspan></text>
    <text x="80" y="288" class="val">› Allosauridae <tspan class="lbl">· family</tspan></text>
    <text x="96" y="310" class="val">› Allosaurus <tspan class="lbl">· genus</tspan></text>
    <text x="112" y="332" class="acctxt">› A. fragilis · species</text>
  </g>
  <rect x="32" y="346" width="150" height="22" rx="11" class="chip"/>
  <text x="44" y="361" class="lbl" font-size="11">Status: valid · FONC-720</text>

  <line x1="32" y1="384" x2="496" y2="384" stroke="#e4e1d8"/>

  <text x="32" y="408" class="eyebrow">KNOWN TIME RANGE</text>
  <text x="496" y="408" class="mono" text-anchor="end">FONC-550 · CONS-200</text>
  <rect x="32" y="420" width="464" height="16" rx="3" fill="#eceae4"/>
  <rect x="300" y="420" width="120" height="16" rx="3" class="badge"/>
  <text x="32" y="454" class="lbl" font-size="11">Late Jurassic · 155–145 Ma</text>
  <rect x="360" y="444" width="136" height="20" rx="10" class="badge"/>
  <text x="428" y="458" class="acctxt" font-size="10.5" text-anchor="middle">≈ approximate · FONC-1140</text>

  <line x1="32" y1="480" x2="496" y2="480" stroke="#e4e1d8"/>

  <text x="32" y="504" class="eyebrow">ILLUSTRATION</text>
  <text x="496" y="504" class="mono" text-anchor="end">FONC-1240</text>
  <rect x="32" y="514" width="464" height="86" rx="6" class="dashed"/>
  <text x="264" y="552" class="lbl" text-anchor="middle">No image available</text>
  <text x="264" y="572" class="lbl" font-size="11" text-anchor="middle">Fallback state shown in place of an illustration</text>

  <line x1="32" y1="620" x2="496" y2="620" stroke="#e4e1d8"/>

  <text x="32" y="644" class="eyebrow">INTERPRETATIVE DATA</text>
  <text x="496" y="644" class="mono" text-anchor="end">FONC-600–630 (V1) · FONC-670</text>
  <g class="lbl">
    <text x="32" y="668">Diet <tspan fill="#a29d92">— not available (interpretative, V1)</tspan></text>
    <text x="32" y="688">Locomotion <tspan fill="#a29d92">— not available (interpretative, V1)</tspan></text>
    <text x="32" y="708">Length / mass <tspan fill="#a29d92">— not available (interpretative, V1)</tspan></text>
  </g>
  <text x="32" y="730" class="acctxt" font-size="11">Kept separate from fossil-derived data (FONC-670 · CONS-440)</text>

  <!-- RIGHT COLUMN -->
  <rect x="528" y="172" width="496" height="572" rx="8" class="card"/>
  <text x="544" y="196" class="eyebrow">FOSSIL OCCURRENCES</text>
  <text x="1008" y="196" class="mono" text-anchor="end">FONC-560</text>
  <g>
    <rect x="544" y="206" width="464" height="34" rx="6" class="ph"/>
    <text x="556" y="221" class="valb" font-size="11">Morrison Fm — Utah, USA</text>
    <text x="556" y="235" class="lbl" font-size="11">153–150 Ma</text>
    <rect x="852" y="214" width="80" height="18" rx="9" class="chip"/>
    <text x="892" y="227" class="lbl" font-size="10" text-anchor="middle">PBDB · src</text>
    <text x="998" y="227" class="acctxt" font-size="11" text-anchor="end">▸ map</text>

    <rect x="544" y="244" width="464" height="34" rx="6" class="ph"/>
    <text x="556" y="259" class="valb" font-size="11">Morrison Fm — Colorado, USA</text>
    <text x="556" y="273" class="lbl" font-size="11">155–152 Ma</text>
    <rect x="852" y="252" width="80" height="18" rx="9" class="chip"/>
    <text x="892" y="265" class="lbl" font-size="10" text-anchor="middle">PBDB · src</text>
    <text x="998" y="265" class="acctxt" font-size="11" text-anchor="end">▸ map</text>

    <rect x="544" y="282" width="464" height="34" rx="6" class="ph"/>
    <text x="556" y="297" class="valb" font-size="11">Lourinhã Fm — Portugal</text>
    <text x="556" y="311" class="lbl" font-size="11">152–145 Ma</text>
    <rect x="852" y="290" width="80" height="18" rx="9" class="chip"/>
    <text x="892" y="303" class="lbl" font-size="10" text-anchor="middle">src</text>
    <text x="998" y="303" class="acctxt" font-size="11" text-anchor="end">▸ map</text>
  </g>

  <line x1="544" y1="330" x2="1008" y2="330" stroke="#e4e1d8"/>
  <text x="544" y="354" class="eyebrow">MODERN DISCOVERY LOCATIONS</text>
  <text x="1008" y="354" class="mono" text-anchor="end">FONC-570</text>
  <text x="544" y="376" class="val">Utah · Colorado · Wyoming (USA) · Portugal</text>

  <line x1="544" y1="394" x2="1008" y2="394" stroke="#e4e1d8"/>
  <text x="544" y="418" class="eyebrow">PALEOGEOGRAPHIC POSITIONS</text>
  <text x="1008" y="418" class="mono" text-anchor="end">FONC-580 · FONC-1130</text>
  <text x="544" y="440" class="val">Western Laurasia (Late Jurassic reconstruction)</text>
  <rect x="856" y="428" width="120" height="20" rx="10" class="badge"/>
  <text x="916" y="442" class="acctxt" font-size="10.5" text-anchor="middle">▲ reconstructed</text>

  <line x1="544" y1="458" x2="1008" y2="458" stroke="#e4e1d8"/>
  <text x="544" y="482" class="eyebrow">SOURCES</text>
  <text x="1008" y="482" class="mono" text-anchor="end">FONC-590 · FONC-1090 · CONS-420</text>
  <g>
    <text x="544" y="504" class="val">Paleobiology Database</text>
    <rect x="900" y="492" width="90" height="18" rx="9" class="chip"/>
    <text x="945" y="505" class="lbl" font-size="10" text-anchor="middle">Database</text>
    <text x="544" y="526" class="val">Madsen, 1976</text>
    <rect x="900" y="514" width="90" height="18" rx="9" class="chip"/>
    <text x="945" y="527" class="lbl" font-size="10" text-anchor="middle">Primary</text>
  </g>
  <text x="544" y="548" class="lbl" font-size="11" fill="#a29d92">Imported 2026-06 · external link where available (FONC-1170/1180, V1)</text>

  <!-- missing field callout -->
  <rect x="544" y="562" width="464" height="52" rx="6" class="dashed"/>
  <text x="560" y="584" class="valb">Estimated mass</text>
  <text x="560" y="602" class="acctxt" font-size="11">Not available — shown as an explicit label, never blank</text>
  <text x="998" y="584" class="mono" text-anchor="end">FONC-490</text>
  <text x="998" y="602" class="mono" text-anchor="end">FONC-1120</text>

  <line x1="544" y1="632" x2="1008" y2="632" stroke="#e4e1d8"/>
  <text x="544" y="656" class="lbl" font-size="11">Interpretation-changing uncertainty stays visible, not hidden</text>
  <text x="544" y="674" class="lbl" font-size="11">behind a secondary interaction (CONS-490).</text>
  <text x="544" y="712" class="valb">≤ 20% silently empty fields</text>
  <text x="1008" y="712" class="mono" text-anchor="end">PERF-180 · PERF-190</text>

  <text x="16" y="754" class="mono" fill="#a29d92">Low-fidelity wireframe — layout &amp; required content only. IDs → docs/product/functional-specification.md</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="'IBM Plex Sans','system-ui','Segoe UI',sans-serif" role="img" aria-label="High-fidelity taxon profile — detailed, source-attributed">
  <style>
    .serif{font-family:'Spectral','Source Serif 4','Charter','Georgia',serif}
    .mono{font-family:'IBM Plex Mono','SFMono-Regular','Menlo',monospace}
    .eyebrow{font-family:'IBM Plex Mono','SFMono-Regular',monospace;font-size:10.5px;letter-spacing:1.4px;fill:#6e8091}
    .h{font-family:'Spectral','Charter','Georgia',serif;font-size:15px;fill:#1f2b38}
    .lbl{font-size:12px;fill:#5f7180}
    .val{font-size:13px;fill:#33424f}
    .hi{font-size:13px;fill:#1f2b38}
    .id{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:#93a2ad}
    .terttxt{fill:#b7791f}
  </style>

  <rect width="1200" height="940" fill="#e9eef2"/>

  <!-- TOP BAR -->
  <rect x="0" y="0" width="1200" height="58" fill="#ffffff"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#cfd8de"/>
  <rect x="24" y="13" width="150" height="32" rx="16" fill="none" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="46" y="33" class="val" font-size="12.5" fill="#0c8f76">←  Back to map</text>
  <text x="192" y="37" class="mono" font-size="11" fill="#6e8091">Map / Theropoda / <tspan fill="#5f7180">Allosaurus fragilis</tspan></text>
  <text x="1176" y="37" class="val" font-size="12" text-anchor="end" fill="#5f7180">Age &amp; filters preserved · 150 Ma</text>

  <!-- HEADER -->
  <text x="24" y="110" class="serif" font-style="italic" font-size="30" fill="#1f2b38">Allosaurus fragilis</text>
  <rect x="24" y="128" width="66" height="24" rx="12" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="57" y="144" class="val" font-size="11.5" text-anchor="middle">Species</text>
  <rect x="98" y="128" width="114" height="24" rx="12" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="155" y="144" class="val" font-size="11.5" text-anchor="middle">Detailed profile</text>
  <text x="24" y="174" class="lbl">Non-avian dinosaur · <tspan class="val" font-weight="600">Main content</tspan></text>
  <rect x="928" y="98" width="248" height="42" rx="8" fill="#0f9d83"/>
  <text x="1052" y="124" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">▸  Show 3 occurrences on map</text>
  <text x="1176" y="162" class="id" text-anchor="end">FONC-560 · FONC-1000 · FONC-1080</text>

  <line x1="24" y1="192" x2="1176" y2="192" stroke="#dde5ea"/>
  <line x1="600" y1="208" x2="600" y2="924" stroke="#dde5ea"/>

  <!-- LEFT COLUMN -->
  <text x="24" y="224" class="h">Classification</text>
  <text x="576" y="224" class="id" text-anchor="end">FONC-540 · 690 · 710</text>
  <g>
    <text x="24" y="250" class="val">Dinosauria <tspan class="lbl">clade</tspan></text>
    <text x="44" y="272" class="val">Saurischia <tspan class="lbl">clade</tspan></text>
    <text x="64" y="294" class="val">Theropoda <tspan class="lbl">clade</tspan></text>
    <text x="84" y="316" class="val">Allosauridae <tspan class="lbl">family</tspan></text>
    <text x="104" y="338" class="val">Allosaurus <tspan class="lbl">genus</tspan></text>
    <text x="124" y="360" class="val" fill="#0c8f76">Allosaurus fragilis <tspan class="lbl" fill="#3f8a76">species</tspan></text>
  </g>
  <!-- validity as a sourced opinion -->
  <rect x="24" y="376" width="92" height="22" rx="11" fill="#e6f3ee" stroke="#9fd3c2"/>
  <text x="38" y="391" font-size="11.5" fill="#0c8f76">✓ Valid</text>
  <text x="124" y="391" class="mono" font-size="10" fill="#6e8091">accepted per Madsen (1976)</text>
  <!-- doubtful synonym -->
  <text x="24" y="416" class="lbl" font-size="11.5">Junior synonym <tspan class="val">Antrodemus valens</tspan></text>
  <rect x="266" y="404" width="104" height="20" rx="10" fill="#f6ecd6" stroke="#dcc58f"/>
  <text x="318" y="418" class="terttxt" font-size="10" text-anchor="middle">◐ nomen dubium</text>
  <text x="378" y="418" class="mono" font-size="10" fill="#6e8091">per Madsen 1976</text>

  <line x1="24" y1="432" x2="576" y2="432" stroke="#dde5ea"/>
  <text x="24" y="456" class="h">Known time range</text>
  <text x="576" y="456" class="id" text-anchor="end">FONC-550 · CONS-200</text>
  <rect x="24" y="468" width="552" height="12" rx="6" fill="#e9eef2" stroke="#dde5ea"/>
  <rect x="360" y="468" width="150" height="12" rx="6" fill="#3E93C6" fill-opacity="0.75"/>
  <text x="24" y="504" class="val">155–145 Ma · Late Jurassic <tspan class="lbl">(Kimmeridgian–Tithonian)</tspan></text>
  <rect x="452" y="492" width="124" height="20" rx="10" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="514" y="506" class="lbl" font-size="10.5" text-anchor="middle" fill="#566573">≈ approximate</text>

  <line x1="24" y1="528" x2="576" y2="528" stroke="#dde5ea"/>
  <text x="24" y="552" class="h">Illustration</text>
  <text x="576" y="552" class="id" text-anchor="end">FONC-1190 · 1200 · 1210 · 1220</text>
  <rect x="24" y="562" width="552" height="132" rx="8" fill="#eef2f5" stroke="#cbd6dd"/>
  <!-- theropod silhouette (stands in for a Commons image) -->
  <path d="M120 660 q10 -40 44 -46 q8 -30 30 -30 q22 0 26 22 q30 4 60 -2 q-8 16 -30 20 q10 26 -6 40 l8 30 h-14 l-8 -26 q-30 8 -60 2 l-6 24 h-14 l4 -26 q-30 -6 -34 -34 z"
        fill="#9fb0bd"/>
  <path d="M300 596 q80 -6 150 8 q40 8 30 34 q-14 30 -70 30 q-70 0 -120 -30 q-30 -18 10 -42 z" fill="#b3c1cb"/>
  <rect x="36" y="668" width="150" height="20" rx="10" fill="#ffffff" stroke="#cbd6dd"/>
  <text x="111" y="682" class="lbl" font-size="10.5" text-anchor="middle">Artistic reconstruction</text>
  <text x="36" y="712" class="lbl" font-size="11">Credit: J. Conway / Wikimedia Commons · <tspan class="mono" font-size="10">CC BY-SA 4.0</tspan></text>
  <rect x="404" y="700" width="172" height="20" rx="10" fill="#f6ecd6" stroke="#dcc58f"/>
  <text x="490" y="714" class="terttxt" font-size="10" text-anchor="middle">▲ Artistic — not exact appearance</text>

  <line x1="24" y1="736" x2="576" y2="736" stroke="#dde5ea"/>
  <text x="24" y="760" class="h">Interpretative data</text>
  <text x="576" y="760" class="id" text-anchor="end">FONC-600–630 · 670</text>
  <g>
    <text x="24" y="786" class="val">Diet <tspan class="hi" font-weight="600">Carnivore</tspan></text>
    <rect x="452" y="774" width="124" height="18" rx="9" fill="#f6ecd6" stroke="#dcc58f"/>
    <text x="514" y="787" class="terttxt" font-size="9.5" text-anchor="middle">Wikipedia · tertiary</text>
    <text x="24" y="810" class="val">Body length <tspan class="hi" font-weight="600">~8.5 m</tspan></text>
    <rect x="452" y="798" width="124" height="18" rx="9" fill="#eef2f5" stroke="#cbd6dd"/>
    <text x="514" y="811" class="lbl" font-size="9.5" text-anchor="middle">PBDB · primary</text>
    <text x="24" y="834" class="val">Body mass <tspan class="hi" font-weight="600">1.5–2.0 t</tspan> <tspan class="lbl">(est. range)</tspan></text>
    <rect x="452" y="822" width="124" height="18" rx="9" fill="#f6ecd6" stroke="#dcc58f"/>
    <text x="514" y="835" class="terttxt" font-size="9.5" text-anchor="middle">Wikipedia · tertiary</text>
    <text x="24" y="858" class="lbl">Locomotion <tspan fill="#6e8091">— not available</tspan></text>
  </g>
  <text x="24" y="884" class="lbl" font-size="11" fill="#6e8091">Each value carries its source; interpretative data is kept separate from fossil facts.</text>

  <!-- RIGHT COLUMN -->
  <text x="624" y="224" class="h">Summary</text>
  <rect x="836" y="210" width="160" height="20" rx="10" fill="#f6ecd6" stroke="#dcc58f"/>
  <text x="916" y="224" class="terttxt" font-size="10" text-anchor="middle">Wikipedia · CC BY-SA 4.0</text>
  <text x="1176" y="224" class="id" text-anchor="end">FONC-640 · FONC-1180</text>
  <text x="624" y="248" class="val" font-size="12.5">Allosaurus is a large theropod dinosaur that lived in North</text>
  <text x="624" y="266" class="val" font-size="12.5">America and Europe during the Late Jurassic. A. fragilis is the</text>
  <text x="624" y="284" class="val" font-size="12.5">type species and among the best-known allosaurids, with many</text>
  <text x="624" y="302" class="val" font-size="12.5">specimens from the Morrison Formation.</text>
  <text x="624" y="326" class="terttxt" font-size="10.5">▲ Editorial summary from Wikipedia (tertiary) — attribution &amp; share-alike apply.</text>

  <line x1="624" y1="344" x2="1176" y2="344" stroke="#dde5ea"/>
  <text x="624" y="368" class="h">Fossil occurrences <tspan class="lbl" font-family="'IBM Plex Sans'">· 3 known</tspan></text>
  <text x="1176" y="368" class="id" text-anchor="end">FONC-560 · FONC-1150</text>
  <g>
    <rect x="624" y="380" width="552" height="34" rx="8" fill="#ffffff" stroke="#cfd8de"/>
    <text x="640" y="401" class="hi" font-size="12">Morrison Fm (Brushy Basin Mbr) — Utah, USA <tspan class="mono" font-size="10" fill="#6e8091">· 153–150 Ma</tspan></text>
    <rect x="1000" y="388" width="88" height="18" rx="9" fill="#eef2f5" stroke="#cbd6dd"/>
    <text x="1044" y="401" class="lbl" font-size="9.5" text-anchor="middle">PBDB</text>
    <text x="1160" y="401" class="val" font-size="11" fill="#0c8f76" text-anchor="end">▸ map</text>
    <rect x="624" y="418" width="552" height="34" rx="8" fill="#ffffff" stroke="#cfd8de"/>
    <text x="640" y="439" class="hi" font-size="12">Lourinhã Fm — Portugal <tspan class="mono" font-size="10" fill="#6e8091">· 151–145 Ma</tspan></text>
    <rect x="1000" y="426" width="88" height="18" rx="9" fill="#eef2f5" stroke="#cbd6dd"/>
    <text x="1044" y="439" class="lbl" font-size="9.5" text-anchor="middle">PBDB</text>
    <text x="1160" y="439" class="val" font-size="11" fill="#0c8f76" text-anchor="end">▸ map</text>
    <rect x="624" y="456" width="552" height="34" rx="8" fill="#ffffff" stroke="#cfd8de"/>
    <text x="640" y="477" class="hi" font-size="12">Morrison Fm — Colorado, USA <tspan class="mono" font-size="10" fill="#6e8091">· 155–152 Ma</tspan></text>
    <rect x="1000" y="464" width="88" height="18" rx="9" fill="#eef2f5" stroke="#cbd6dd"/>
    <text x="1044" y="477" class="lbl" font-size="9.5" text-anchor="middle">Primary</text>
    <text x="1160" y="477" class="val" font-size="11" fill="#0c8f76" text-anchor="end">▸ map</text>
  </g>

  <line x1="624" y1="506" x2="1176" y2="506" stroke="#dde5ea"/>
  <text x="624" y="530" class="h">Modern discovery locations</text>
  <text x="1176" y="530" class="id" text-anchor="end">FONC-570</text>
  <text x="624" y="552" class="val">Utah · Colorado · Wyoming (USA) · Portugal</text>

  <line x1="624" y1="570" x2="1176" y2="570" stroke="#dde5ea"/>
  <text x="624" y="594" class="h">Paleogeographic positions</text>
  <rect x="884" y="580" width="118" height="20" rx="10" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="943" y="594" class="lbl" font-size="10.5" text-anchor="middle" fill="#566573">▲ reconstructed</text>
  <text x="1176" y="594" class="id" text-anchor="end">FONC-580 · 1130</text>
  <text x="624" y="616" class="val">Western Laurasia (Late Jurassic reconstruction)</text>

  <line x1="624" y1="634" x2="1176" y2="634" stroke="#dde5ea"/>
  <text x="624" y="658" class="h">Sources</text>
  <text x="1176" y="658" class="id" text-anchor="end">FONC-590 · 1090 · CONS-420</text>
  <text x="624" y="680" class="val">Paleobiology Database</text>
  <rect x="1046" y="668" width="102" height="18" rx="9" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="1097" y="681" class="lbl" font-size="9.5" text-anchor="middle">Database</text>
  <text x="624" y="702" class="val">Madsen, J. H. (1976)</text>
  <rect x="1046" y="690" width="102" height="18" rx="9" fill="#eef2f5" stroke="#cbd6dd"/>
  <text x="1097" y="703" class="lbl" font-size="9.5" text-anchor="middle">Primary</text>
  <text x="624" y="724" class="val">Wikipedia — “Allosaurus”</text>
  <rect x="1046" y="712" width="102" height="18" rx="9" fill="#f6ecd6" stroke="#dcc58f"/>
  <text x="1097" y="725" class="terttxt" font-size="9.5" text-anchor="middle">Encyclopedic</text>
  <text x="624" y="744" class="lbl" font-size="11" fill="#6e8091">Imported 2026-06 · external links where available (FONC-1170/1180)</text>

  <!-- explicit missing field -->
  <rect x="624" y="758" width="552" height="50" rx="8" fill="#ffffff" stroke="#cbd6dd" stroke-dasharray="6 5"/>
  <text x="640" y="780" class="hi" font-size="12.5">Body-mass estimation method</text>
  <text x="640" y="798" class="val" font-size="11.5" fill="#566573">Not stated by source — shown as a label, never blank</text>
  <text x="1160" y="780" class="id" text-anchor="end">FONC-490</text>
  <text x="1160" y="798" class="id" text-anchor="end">FONC-1120</text>

  <text x="624" y="832" class="lbl" font-size="11.5">Every displayed value resolves to a source or is marked editorial (CONS-390…440).</text>
  <text x="624" y="862" class="val" font-size="12" font-weight="600">≤ 20% empty fields</text>
  <text x="1176" y="862" class="id" text-anchor="end">PERF-180 · PERF-190</text>
</svg>

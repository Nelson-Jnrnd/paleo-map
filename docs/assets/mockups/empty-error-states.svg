<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 628" font-family="'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Wireframes of empty and error states">
  <style>
    .h1{font-size:18px;font-weight:700;fill:#2b2b28}
    .sub{font-size:12px;fill:#8a857a}
    .eyebrow{font-size:10px;letter-spacing:1.3px;font-weight:700;fill:#8a857a}
    .title{font-size:15px;font-weight:700;fill:#2b2b28}
    .msg{font-size:12.5px;fill:#6f6b62}
    .mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:9.5px;fill:#5f7891}
    .card{fill:#ffffff;stroke:#d8d5cd;stroke-width:1}
    .accfill{fill:#b07a35}
    .acctxt{fill:#b07a35;font-weight:700}
    .accbox{fill:#ffffff;stroke:#b07a35;stroke-width:1.4}
    .errfill{fill:#a3453b}
    .errtint{fill:#f2ddd9;stroke:#d9a69d;stroke-width:1}
    .accicon{fill:#f0e4d2;stroke:#cdaa72;stroke-width:1}
  </style>

  <rect width="1040" height="628" fill="#f6f5f2"/>
  <text x="24" y="40" class="h1">Empty &amp; error states</text>
  <text x="24" y="60" class="sub">Never a blank — always explain, offer a way forward, and preserve filters.</text>

  <!-- Card A: empty filters -->
  <rect x="24" y="88" width="480" height="232" rx="10" class="card"/>
  <text x="48" y="118" class="eyebrow">EMPTY · FILTERED RESULTS</text>
  <rect x="48" y="132" width="44" height="44" rx="10" class="accicon"/>
  <text x="70" y="162" class="acctxt" font-size="20" text-anchor="middle">∅</text>
  <text x="108" y="150" class="title">No occurrences match these filters</text>
  <text x="108" y="172" class="msg">Try removing a filter, or reset all to start over.</text>
  <rect x="108" y="188" width="150" height="32" rx="8" class="accbox"/>
  <text x="183" y="209" class="acctxt" font-size="12.5" text-anchor="middle">↺  Reset all filters</text>
  <text x="48" y="252" class="msg" font-size="11.5">Active filters stay visible so context is not lost.</text>
  <text x="480" y="300" class="mono" text-anchor="end">FONC-1280 · FONC-860 · PERF-320</text>

  <!-- Card B: no search result -->
  <rect x="536" y="88" width="480" height="232" rx="10" class="card"/>
  <text x="560" y="118" class="eyebrow">EMPTY · SEARCH</text>
  <rect x="560" y="132" width="44" height="44" rx="10" class="accicon"/>
  <text x="582" y="163" class="acctxt" font-size="19" text-anchor="middle">⌕</text>
  <text x="620" y="150" class="title">No taxon found for “velocirapto”</text>
  <text x="620" y="172" class="msg">Check the spelling, or search another scientific name.</text>
  <text x="620" y="204" class="acctxt" font-size="12.5">✕  Clear search</text>
  <text x="560" y="252" class="msg" font-size="11.5">Search accepts scientific names (FONC-760).</text>
  <text x="992" y="300" class="mono" text-anchor="end">FONC-1290 · PERF-330</text>

  <!-- Card C: map load failure -->
  <rect x="24" y="344" width="480" height="232" rx="10" class="card"/>
  <rect x="24" y="344" width="480" height="6" rx="3" class="errfill"/>
  <text x="48" y="378" class="eyebrow" fill="#a3453b">ERROR · MAP</text>
  <rect x="48" y="392" width="44" height="44" rx="10" class="errtint"/>
  <text x="70" y="423" class="errfill" font-size="22" font-weight="700" text-anchor="middle">!</text>
  <text x="108" y="410" class="title">The map couldn’t be loaded</text>
  <text x="108" y="432" class="msg">Check your connection and try again.</text>
  <rect x="108" y="448" width="96" height="32" rx="8" class="errfill"/>
  <text x="156" y="469" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">Retry</text>
  <text x="216" y="469" class="msg" font-size="11.5">Filters preserved.</text>
  <text x="48" y="512" class="msg" font-size="11.5">Retry re-attempts only the map — no full reload.</text>
  <text x="480" y="556" class="mono" text-anchor="end">FONC-1310 · PERF-280 · FONC-1340</text>

  <!-- Card D: profile load failure -->
  <rect x="536" y="344" width="480" height="232" rx="10" class="card"/>
  <rect x="536" y="344" width="480" height="6" rx="3" class="errfill"/>
  <text x="560" y="378" class="eyebrow" fill="#a3453b">ERROR · TAXON PROFILE</text>
  <rect x="560" y="392" width="44" height="44" rx="10" class="errtint"/>
  <text x="582" y="423" class="errfill" font-size="22" font-weight="700" text-anchor="middle">!</text>
  <text x="620" y="410" class="title">This taxon profile couldn’t be loaded</text>
  <text x="620" y="432" class="msg">The rest of the atlas is still available.</text>
  <rect x="620" y="448" width="96" height="32" rx="8" class="errfill"/>
  <text x="668" y="469" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">Retry</text>
  <text x="728" y="469" class="msg" font-size="11.5">Filters preserved.</text>
  <text x="560" y="512" class="msg" font-size="11.5">Retry without reloading the whole application.</text>
  <text x="992" y="556" class="mono" text-anchor="end">FONC-1320 · PERF-290 · PERF-300</text>

  <text x="24" y="608" class="mono" fill="#a29d92">Low-fidelity wireframe — layout &amp; required content only. IDs → docs/product/functional-specification.md</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Wireframe of the main exploration view: map, time control and filters">
  <style>
    .h1{font-size:17px;font-weight:700;fill:#2b2b28}
    .sub{font-size:11px;fill:#8a857a}
    .eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:700;fill:#8a857a}
    .lbl{font-size:12px;fill:#6f6b62}
    .val{font-size:12px;fill:#2b2b28}
    .valb{font-size:12px;font-weight:700;fill:#2b2b28}
    .big{font-size:26px;font-weight:700;fill:#2b2b28}
    .mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:9.5px;fill:#5f7891}
    .card{fill:#ffffff;stroke:#d8d5cd;stroke-width:1}
    .chip{fill:#f0efe9;stroke:#d8d5cd;stroke-width:1}
    .ph{fill:#eceae4}
    .seg{fill:#ffffff;stroke:#b8b4aa;stroke-width:1}
    .accfill{fill:#b07a35}
    .acctxt{fill:#b07a35;font-size:12px;font-weight:700}
    .badge{fill:#f0e4d2;stroke:#cdaa72;stroke-width:1}
    .land{fill:#e4e1d8;stroke:#c9c6bf;stroke-width:1}
  </style>

  <rect width="1040" height="720" fill="#f6f5f2"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1040" height="56" fill="#ffffff" stroke="#d8d5cd"/>
  <text x="24" y="27" class="h1">Interactive Mesozoic Dinosaur Atlas</text>
  <text x="24" y="44" class="sub">Map-first exploration of non-avian dinosaurs · 252–66 Ma</text>
  <rect x="726" y="14" width="290" height="28" rx="14" class="chip"/>
  <circle cx="746" cy="28" r="6" fill="none" stroke="#8a857a" stroke-width="1.5"/>
  <line x1="750" y1="32" x2="756" y2="38" stroke="#8a857a" stroke-width="1.5"/>
  <text x="766" y="32" class="lbl">Search scientific name…</text>
  <text x="1016" y="52" class="mono" text-anchor="end">FONC-760</text>

  <!-- Left filter rail -->
  <rect x="16" y="72" width="228" height="632" rx="8" class="card"/>
  <text x="32" y="98" class="eyebrow">FILTERS</text>
  <text x="212" y="98" class="mono" text-anchor="end">FONC-030</text>

  <text x="32" y="126" class="eyebrow" fill="#6f6b62">PERIOD</text>
  <g>
    <rect x="32" y="134" width="65" height="30" rx="4" class="seg"/>
    <rect x="97" y="134" width="65" height="30" rx="0" class="accfill"/>
    <rect x="162" y="134" width="66" height="30" rx="4" class="seg"/>
    <text x="64" y="153" class="val" text-anchor="middle">Tri</text>
    <text x="129" y="153" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Jur</text>
    <text x="195" y="153" class="val" text-anchor="middle">Cre</text>
  </g>
  <text x="228" y="180" class="mono" text-anchor="end">FONC-780</text>

  <text x="32" y="204" class="eyebrow" fill="#6f6b62">TAXONOMIC GROUP</text>
  <rect x="32" y="212" width="196" height="30" rx="4" class="seg"/>
  <text x="44" y="231" class="val">Theropoda</text>
  <text x="216" y="231" class="lbl" text-anchor="end">▾</text>
  <text x="228" y="258" class="mono" text-anchor="end">FONC-790</text>

  <text x="32" y="284" class="valb">Dinosaurs only</text>
  <rect x="188" y="274" width="40" height="20" rx="10" class="accfill"/>
  <circle cx="218" cy="284" r="8" fill="#ffffff"/>
  <text x="228" y="312" class="mono" text-anchor="end">FONC-800</text>

  <line x1="32" y1="328" x2="228" y2="328" stroke="#e4e1d8"/>

  <text x="32" y="352" class="eyebrow" fill="#6f6b62">ACTIVE FILTERS</text>
  <rect x="32" y="360" width="78" height="24" rx="12" class="badge"/>
  <text x="46" y="376" class="acctxt" font-size="11">Jurassic</text>
  <text x="98" y="376" class="acctxt" font-size="11">✕</text>
  <rect x="116" y="360" width="90" height="24" rx="12" class="badge"/>
  <text x="130" y="376" class="acctxt" font-size="11">Theropoda</text>
  <text x="194" y="376" class="acctxt" font-size="11">✕</text>
  <text x="228" y="402" class="mono" text-anchor="end">FONC-870</text>

  <text x="32" y="428" class="acctxt">↺  Reset all filters</text>
  <text x="228" y="428" class="mono" text-anchor="end">FONC-880</text>

  <rect x="32" y="446" width="196" height="60" rx="6" class="ph"/>
  <text x="44" y="478" class="big">47</text>
  <text x="90" y="472" class="lbl">occurrences</text>
  <text x="90" y="488" class="lbl">matching filters</text>
  <text x="228" y="524" class="mono" text-anchor="end">FONC-060 · FONC-850</text>

  <text x="32" y="560" class="lbl" font-size="11">Keyboard-operable filters</text>
  <text x="32" y="576" class="lbl" font-size="11">(PERF-230)</text>

  <!-- Status strip -->
  <rect x="260" y="72" width="764" height="34" rx="8" class="card"/>
  <text x="276" y="93" class="lbl">Selected age</text>
  <text x="348" y="93" class="valb">≈ 150 Ma · Jurassic</text>
  <text x="500" y="93" class="mono">FONC-040</text>
  <line x1="560" y1="80" x2="560" y2="98" stroke="#e4e1d8"/>
  <text x="576" y="93" class="lbl">Group</text>
  <text x="616" y="93" class="valb">Dinosaurs</text>
  <text x="690" y="93" class="mono">FONC-050</text>
  <line x1="752" y1="80" x2="752" y2="98" stroke="#e4e1d8"/>
  <text x="768" y="93" class="lbl">Visible</text>
  <text x="812" y="93" class="valb">47 occurrences</text>
  <text x="924" y="93" class="mono">FONC-020</text>

  <!-- Map card -->
  <rect x="260" y="116" width="764" height="452" rx="8" class="card"/>
  <clipPath id="mapclip"><rect x="261" y="117" width="762" height="450" rx="8"/></clipPath>
  <g clip-path="url(#mapclip)">
    <rect x="261" y="117" width="762" height="450" fill="#fbfbf9"/>
    <!-- graticule -->
    <g stroke="#eeece6" stroke-width="1">
      <line x1="261" y1="192" x2="1023" y2="192"/><line x1="261" y1="267" x2="1023" y2="267"/>
      <line x1="261" y1="342" x2="1023" y2="342"/><line x1="261" y1="417" x2="1023" y2="417"/>
      <line x1="261" y1="492" x2="1023" y2="492"/>
      <line x1="380" y1="117" x2="380" y2="567"/><line x1="500" y1="117" x2="500" y2="567"/>
      <line x1="620" y1="117" x2="620" y2="567"/><line x1="740" y1="117" x2="740" y2="567"/>
      <line x1="860" y1="117" x2="860" y2="567"/>
    </g>
    <!-- reconstructed landmasses (Pangaea-ish blobs) -->
    <path class="land" d="M330 250 q60 -60 180 -40 q90 15 120 70 q20 60 -50 95 q-120 45 -230 5 q-60 -30 -20 -130 z"/>
    <path class="land" d="M640 300 q70 -50 170 -25 q80 25 70 90 q-15 70 -140 75 q-110 0 -120 -70 q-6 -45 20 -70 z"/>
    <!-- occurrence points -->
    <g fill="#b07a35" stroke="#8a5f27" stroke-width="1">
      <circle cx="410" cy="245" r="5"/><circle cx="452" cy="280" r="5"/>
      <circle cx="500" cy="235" r="5"/><circle cx="470" cy="320" r="5"/>
      <circle cx="700" cy="330" r="5"/><circle cx="760" cy="300" r="5"/>
      <circle cx="800" cy="355" r="5"/>
    </g>
    <!-- cluster -->
    <circle cx="545" cy="285" r="17" fill="#b07a35" fill-opacity="0.25" stroke="#b07a35"/>
    <circle cx="545" cy="285" r="11" fill="#b07a35"/>
    <text x="545" y="289" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">12</text>
  </g>
  <!-- reconstruction badge -->
  <rect x="276" y="132" width="256" height="24" rx="12" class="badge"/>
  <text x="290" y="148" class="acctxt" font-size="11">▲ PALEOGEOGRAPHIC RECONSTRUCTION</text>
  <text x="290" y="174" class="mono">FONC-300</text>
  <!-- legend -->
  <rect x="276" y="516" width="230" height="38" rx="6" fill="#ffffff" stroke="#d8d5cd"/>
  <circle cx="292" cy="529" r="5" fill="#b07a35" stroke="#8a5f27"/>
  <text x="304" y="533" class="lbl" font-size="11">Occurrence</text>
  <circle cx="392" cy="529" r="8" fill="#b07a35" fill-opacity="0.3" stroke="#b07a35"/>
  <text x="406" y="533" class="lbl" font-size="11">Cluster</text>
  <text x="292" y="548" class="mono">FONC-230 · FONC-240 (discovery evidence, FONC-1150)</text>
  <!-- zoom controls -->
  <rect x="980" y="500" width="30" height="54" rx="6" fill="#ffffff" stroke="#b8b4aa"/>
  <line x1="985" y1="527" x2="1005" y2="527" stroke="#b8b4aa"/>
  <text x="995" y="521" class="valb" text-anchor="middle">+</text>
  <text x="995" y="548" class="valb" text-anchor="middle">–</text>
  <text x="974" y="493" class="mono" text-anchor="end">FONC-250/260 · PERF-110</text>

  <!-- Time control -->
  <rect x="260" y="580" width="764" height="108" rx="8" class="card"/>
  <text x="276" y="606" class="eyebrow" fill="#6f6b62">GEOLOGICAL TIME · 252–66 Ma</text>
  <text x="1008" y="606" class="mono" text-anchor="end">FONC-090 · FONC-100 · FONC-110 · FONC-120</text>
  <!-- track segments -->
  <rect x="300" y="632" width="200" height="16" fill="#eceae4" stroke="#c9c6bf"/>
  <rect x="500" y="632" width="212" height="16" fill="#e7ddcb" stroke="#cdaa72"/>
  <rect x="712" y="632" width="272" height="16" fill="#eceae4" stroke="#c9c6bf"/>
  <text x="400" y="668" class="lbl" font-size="11" text-anchor="middle">Triassic</text>
  <text x="606" y="668" class="acctxt" font-size="11" text-anchor="middle">Jurassic</text>
  <text x="848" y="668" class="lbl" font-size="11" text-anchor="middle">Cretaceous</text>
  <text x="300" y="626" class="mono">252</text>
  <text x="500" y="626" class="mono" text-anchor="middle">201</text>
  <text x="712" y="626" class="mono" text-anchor="middle">145</text>
  <text x="984" y="626" class="mono" text-anchor="end">66 Ma</text>
  <!-- handle -->
  <line x1="600" y1="624" x2="600" y2="656" stroke="#b07a35" stroke-width="2"/>
  <polygon points="600,656 593,668 607,668" fill="#b07a35"/>
  <rect x="566" y="600" width="68" height="22" rx="11" class="accfill"/>
  <text x="600" y="615" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">≈ 150 Ma</text>
  <text x="606" y="684" class="mono" text-anchor="middle">precise age vs range: FONC-170 · steps by stage (OQ-030)</text>

  <!-- footer note -->
  <text x="16" y="716" class="mono" fill="#a29d92">Low-fidelity wireframe — layout &amp; required content only. IDs → docs/product/functional-specification.md</text>
</svg>

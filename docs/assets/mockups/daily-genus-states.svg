<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" font-family="'Courier New',Courier,monospace" role="img" aria-label="State variants for the Daily Genus puzzle: fresh, won, lost, already played, practice, rejected guesses, hint taken, storage unavailable, and pool error">
  <style>
    .h{font-size:13.5px;fill:#1f2b38;font-weight:700}
    .lbl{font-size:11.5px;fill:#52606e}
    .val{font-size:12px;fill:#33424f}
    .hi{font-size:12.5px;fill:#1f2b38}
    .faint{font-size:10.5px;fill:#5b6773}
    .id{font-size:9px;fill:#5f6a75}
    .it{font-style:italic}
  </style>

  <rect width="1200" height="1090" fill="#e9eef2"/>

  <text x="24" y="44" font-size="20" font-weight="700" fill="#1f2b38">Daily Genus — state variants</text>
  <text x="24" y="66" class="lbl">Every real state is designed, not just the win. No state is blank, and no verdict is carried by colour alone.</text>
  <text x="1176" y="66" class="id" text-anchor="end">SPEC-019 UX-002 · UX-003</text>

  <!-- ============ 1 · FRESH ============ -->
  <rect x="24" y="92" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="44" y="122" class="h">Fresh round</text>
  <text x="372" y="122" class="id" text-anchor="end">REQ-005</text>
  <text x="44" y="144" class="faint">Zero guesses. The tree starts at the root, and stops.</text>
  <circle cx="52" cy="176" r="5.5" fill="#b4bcc6" stroke="#8b96a3"/>
  <text x="68" y="180" class="hi" font-weight="700">Dinosauria <tspan class="faint" font-weight="400">clade · root</tspan></text>
  <line x1="52" y1="182" x2="52" y2="204" stroke="#cdd9e0" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="66" cy="212" r="6.5" fill="#ffffff" stroke="#8b96a3" stroke-dasharray="3 3"/>
  <text x="82" y="216" class="lbl">?  unresolved</text>
  <text x="44" y="248" class="faint">The descent is hidden, and how deep it runs</text>
  <text x="44" y="264" class="faint">is not stated — that is the puzzle.</text>
  <rect x="44" y="284" width="230" height="34" rx="6" fill="#ffffff" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="60" y="306" class="lbl">Type a genus…</text>
  <rect x="282" y="284" width="86" height="34" rx="6" fill="#0a7f66"/>
  <text x="325" y="306" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Guess</text>
  <text x="44" y="340" class="faint">8 guesses · resets 00:00 UTC</text>
  <text x="44" y="364" class="faint">Classification per PBDB snapshot · 26 Jul 2026</text>

  <!-- ============ 2 · WON ============ -->
  <rect x="416" y="92" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="436" y="122" class="h">Solved</text>
  <text x="764" y="122" class="id" text-anchor="end">REQ-007 · REQ-011</text>
  <rect x="436" y="136" width="140" height="24" rx="12" fill="#e6f3ee" stroke="#9fd3c2"/>
  <text x="506" y="152" class="faint" fill="#0a7f66" text-anchor="middle">✓ Solved in 5</text>
  <path d="M640 196 q6 -28 34 -30 q16 -14 36 -9 q19 5 21 19 q17 3 22 13 h-24 l-7 9 h-14 l-5 -9 h-25 l-6 9 h-14 l-4 -9 z" fill="#33424f" opacity="0.7"/>
  <text x="436" y="192" class="it" font-size="19" font-weight="700" fill="#1f2b38">Tyrannosaurus</text>
  <text x="436" y="214" class="faint">genus · 83.6–66 Ma · Late Cretaceous</text>
  <text x="436" y="236" class="faint">Dinosauria › Theropoda › … › Tyrannosaurini</text>
  <text x="436" y="258" class="faint">Accepted per H. F. Osborn, 1905</text>
  <rect x="436" y="278" width="164" height="34" rx="6" fill="#0a7f66"/>
  <text x="518" y="300" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Open taxon page</text>
  <rect x="610" y="278" width="154" height="34" rx="6" fill="#ffffff" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="687" y="300" font-size="12" fill="#0a7f66" text-anchor="middle">Copy result</text>
  <text x="436" y="336" class="faint">The shared text names no taxon:</text>
  <rect x="436" y="346" width="290" height="26" rx="4" fill="#f7fafb" stroke="#dde5ea"/>
  <text x="450" y="364" class="faint" fill="#33424f">Daily Genus 128 · 5/8 · ▲▲···</text>

  <!-- ============ 3 · LOST ============ -->
  <rect x="808" y="92" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="828" y="122" class="h">Not solved</text>
  <text x="1156" y="122" class="id" text-anchor="end">REQ-007</text>
  <rect x="828" y="136" width="170" height="24" rx="12" fill="#f6efe2" stroke="#d9c49a"/>
  <text x="913" y="152" class="faint" fill="#8a5a12" text-anchor="middle">8 of 8 used · answer:</text>
  <text x="828" y="192" class="it" font-size="19" font-weight="700" fill="#1f2b38">Tyrannosaurus</text>
  <text x="828" y="216" class="faint">You reached <tspan fill="#33424f">Tyrannosauridae</tspan> — two steps short.</text>
  <text x="828" y="240" class="faint">Dinosauria › Theropoda › Neotheropoda ›</text>
  <text x="828" y="256" class="faint">Averostra › Tetanurae › Coelurosauria ›</text>
  <text x="828" y="272" class="faint">Tyrannosauroidea › Tyrannosauridae ›</text>
  <text x="828" y="288" class="faint">Tyrannosaurinae › Tyrannosaurini</text>
  <text x="828" y="312" class="faint">Accepted per H. F. Osborn, 1905</text>
  <rect x="828" y="328" width="164" height="34" rx="6" fill="#0a7f66"/>
  <text x="910" y="350" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Open taxon page</text>
  <text x="828" y="380" class="faint">A loss still shows the whole descent.</text>

  <!-- ============ 4 · ALREADY PLAYED ============ -->
  <rect x="24" y="416" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="44" y="446" class="h">Already played today</text>
  <text x="372" y="446" class="id" text-anchor="end">REQ-009 · REQ-013</text>
  <text x="44" y="470" class="faint">Today’s round is finished. Nothing to replay.</text>
  <rect x="44" y="486" width="328" height="70" rx="8" fill="#f7fafb" stroke="#dde5ea"/>
  <text x="60" y="512" class="lbl">Next puzzle in</text>
  <text x="356" y="514" font-size="20" font-weight="700" fill="#1f2b38" text-anchor="end">06:12:44</text>
  <text x="60" y="536" class="faint">Resets 00:00 UTC · the same genus worldwide</text>
  <text x="44" y="584" class="faint">Played 41 · solved 34 · streak 6 · best 11</text>
  <text x="44" y="608" class="faint">Solved in   3 ▍▍  4 ▍▍▍▍  5 ▍▍▍▍▍▍  6 ▍▍▍</text>
  <rect x="44" y="628" width="154" height="34" rx="6" fill="#ffffff" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="121" y="650" font-size="12" fill="#0a7f66" text-anchor="middle">Copy result</text>
  <rect x="208" y="628" width="164" height="34" rx="6" fill="#ffffff" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="290" y="650" font-size="12" fill="#0a7f66" text-anchor="middle">Practice round</text>
  <text x="44" y="684" class="faint">At 00:00 UTC this becomes “Start today’s</text>
  <text x="44" y="700" class="faint">puzzle” — never a silent swap mid-round.</text>

  <!-- ============ 5 · PRACTICE ============ -->
  <rect x="416" y="416" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="436" y="446" class="h">Practice round</text>
  <text x="764" y="446" class="id" text-anchor="end">REQ-010</text>
  <rect x="436" y="460" width="328" height="44" rx="6" fill="#f2f5f7" stroke="#d7dee4"/>
  <text x="452" y="478" class="faint" fill="#33424f">Practice — not today’s puzzle.</text>
  <text x="452" y="494" class="faint" fill="#33424f">Nothing here is recorded.</text>
  <text x="436" y="524" class="faint">Same tree, same eight guesses, same clues.</text>
  <text x="436" y="544" class="faint">Never draws today’s genus, so it cannot</text>
  <text x="436" y="560" class="faint">spoil the daily.</text>
  <circle cx="444" cy="586" r="5.5" fill="#b4bcc6" stroke="#8b96a3"/>
  <text x="460" y="590" class="hi">Dinosauria</text>
  <line x1="444" y1="592" x2="444" y2="610" stroke="#cdd9e0" stroke-width="1.5"/>
  <circle cx="458" cy="618" r="5.5" fill="#82b6a7" stroke="#5e9385"/>
  <text x="474" y="622" class="hi">Sauropodomorpha</text>
  <line x1="458" y1="624" x2="458" y2="642" stroke="#cdd9e0" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="472" cy="650" r="6.5" fill="#ffffff" stroke="#8b96a3" stroke-dasharray="3 3"/>
  <text x="488" y="654" class="lbl">?  unresolved</text>
  <rect x="436" y="670" width="220" height="34" rx="6" fill="#ffffff" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="546" y="692" font-size="12" fill="#0a7f66" text-anchor="middle">Back to today’s puzzle</text>

  <!-- ============ 6 · REJECTED GUESSES ============ -->
  <rect x="808" y="416" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="828" y="446" class="h">A guess that cannot be taken</text>
  <text x="1156" y="446" class="id" text-anchor="end">REQ-003</text>
  <text x="828" y="468" class="faint">Never consumes a guess. Always says why.</text>

  <rect x="828" y="484" width="328" height="52" rx="6" fill="#fbf7f0" stroke="#e0d0b4"/>
  <text x="844" y="504" class="val it">Ornithischia</text>
  <text x="844" y="522" class="faint" fill="#8a5a12">Not a genus — that is a clade.</text>

  <rect x="828" y="546" width="328" height="52" rx="6" fill="#fbf7f0" stroke="#e0d0b4"/>
  <text x="844" y="566" class="val it">Antrodemus</text>
  <text x="844" y="584" class="faint" fill="#8a5a12">In the snapshot, but Synonymous, not Valid.</text>

  <rect x="828" y="608" width="328" height="52" rx="6" fill="#fbf7f0" stroke="#e0d0b4"/>
  <text x="844" y="628" class="val it">Smilodon</text>
  <text x="844" y="646" class="faint" fill="#8a5a12">Outside Dinosauria — not in this atlas.</text>

  <rect x="828" y="670" width="328" height="34" rx="6" fill="#f2f5f7" stroke="#d7dee4"/>
  <text x="844" y="692" class="faint" fill="#5b6773">Velociraptor — already guessed (guess 3).</text>

  <!-- ============ 7 · HINT TAKEN ============ -->
  <rect x="24" y="740" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="44" y="770" class="h">Hint taken</text>
  <text x="372" y="770" class="id" text-anchor="end">REQ-008</text>
  <text x="44" y="792" class="faint">Offered from guess 5. Optional, never automatic.</text>
  <rect x="44" y="806" width="328" height="118" rx="8" fill="#f7fafb" stroke="#dde5ea"/>
  <text x="60" y="828" class="faint">The answer’s silhouette</text>
  <path d="M92 906 q10 -44 54 -48 q26 -21 58 -13 q30 8 34 29 q25 4 33 19 h-37 l-10 13 h-21 l-8 -13 h-39 l-10 13 h-21 l-6 -13 z" fill="#33424f" opacity="0.72"/>
  <text x="44" y="952" class="faint">Consumes no guess. The round continues at 5 of 8.</text>
  <rect x="44" y="966" width="270" height="26" rx="13" fill="#f2f5f7" stroke="#d7dee4"/>
  <text x="60" y="984" class="faint" fill="#5b6773">Hint used — marked in your result</text>
  <text x="44" y="1018" class="faint">Every genus has one, so the hint always exists.</text>

  <!-- ============ 8 · STORAGE / CLIPBOARD ============ -->
  <rect x="416" y="740" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="436" y="770" class="h">Storage or clipboard blocked</text>
  <text x="764" y="788" class="id" text-anchor="end">REQ-011 · SEC-002</text>
  <text x="436" y="810" class="faint">Degraded, never broken. The round still plays.</text>

  <rect x="436" y="824" width="328" height="66" rx="6" fill="#fbf7f0" stroke="#e0d0b4"/>
  <text x="452" y="846" class="val" fill="#8a5a12">Progress will not be kept</text>
  <text x="452" y="864" class="faint">This browser blocks local storage. You can</text>
  <text x="452" y="880" class="faint">finish, but a reload starts the round over.</text>

  <rect x="436" y="900" width="328" height="76" rx="6" fill="#f7fafb" stroke="#dde5ea"/>
  <text x="452" y="922" class="val">Copy is unavailable — your result:</text>
  <rect x="452" y="932" width="290" height="30" rx="4" fill="#ffffff" stroke="#cfd8de"/>
  <text x="466" y="952" class="faint" fill="#33424f">Daily Genus 128 · 5/8 · hint · ▲··▲·</text>

  <text x="436" y="1000" class="faint">Nothing is ever sent anywhere. Stored data is</text>
  <text x="436" y="1016" class="faint">ids, counts and dates — clearing it resets cleanly.</text>

  <!-- ============ 9 · POOL ERROR ============ -->
  <rect x="808" y="740" width="368" height="300" rx="8" fill="#ffffff" stroke="#cfd8de"/>
  <text x="828" y="770" class="h">The puzzle cannot be built</text>
  <text x="1156" y="788" class="id" text-anchor="end">Error handling</text>
  <text x="828" y="810" class="faint">The snapshot loaded, but too few genera qualify.</text>

  <rect x="828" y="824" width="328" height="96" rx="6" fill="#fbf1ef" stroke="#e0b5ad"/>
  <text x="844" y="848" class="val" fill="#c0392b">No puzzle today</text>
  <text x="844" y="868" class="faint">The snapshot did not yield enough genera to</text>
  <text x="844" y="884" class="faint">build a fair round, so no genus was chosen.</text>
  <text x="844" y="900" class="faint">A data problem, not a wrong guess.</text>

  <rect x="828" y="936" width="120" height="34" rx="6" fill="#0a7f66"/>
  <text x="888" y="958" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Retry</text>
  <rect x="960" y="936" width="150" height="34" rx="6" fill="#ffffff" stroke="#0f9d83" stroke-width="1.4"/>
  <text x="1035" y="958" font-size="12" fill="#0a7f66" text-anchor="middle">Back to map</text>

  <text x="828" y="1000" class="faint">Red marks the failure; recovery stays teal.</text>
  <text x="828" y="1016" class="faint">The game never starts on a degraded pool.</text>
</svg>

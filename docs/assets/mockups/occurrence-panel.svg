<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Wireframe of the fossil occurrence information panel">
  <style>
    .eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:700;fill:#8a857a}
    .lbl{font-size:12px;fill:#6f6b62}
    .val{font-size:13px;fill:#2b2b28}
    .valb{font-size:13px;font-weight:700;fill:#2b2b28}
    .mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:9.5px;fill:#5f7891}
    .card{fill:#ffffff;stroke:#d8d5cd;stroke-width:1}
    .chip{fill:#f0efe9;stroke:#d8d5cd;stroke-width:1}
    .badge{fill:#f0e4d2;stroke:#cdaa72;stroke-width:1}
    .acctxt{fill:#b07a35;font-weight:700}
    .accfill{fill:#b07a35}
    .land{fill:#e4e1d8;stroke:#c9c6bf;stroke-width:1}
  </style>

  <rect width="760" height="600" fill="#f6f5f2"/>

  <!-- map backdrop (context) -->
  <rect x="0" y="0" width="316" height="600" fill="#fbfbf9"/>
  <g stroke="#eeece6"><line x1="0" y1="150" x2="316" y2="150"/><line x1="0" y1="300" x2="316" y2="300"/><line x1="0" y1="450" x2="316" y2="450"/><line x1="150" y1="0" x2="150" y2="600"/></g>
  <path class="land" d="M40 210 q60 -50 150 -30 q70 20 60 80 q-10 70 -120 70 q-90 0 -110 -60 q-8 -35 20 -60 z"/>
  <g fill="#c8b48f" stroke="#b8b4aa"><circle cx="90" cy="250" r="4"/><circle cx="140" cy="300" r="4"/><circle cx="200" cy="270" r="4"/></g>
  <!-- selected occurrence -->
  <circle cx="168" cy="288" r="14" fill="#b07a35" fill-opacity="0.25"/>
  <circle cx="168" cy="288" r="6" class="accfill" stroke="#8a5f27"/>
  <line x1="180" y1="286" x2="320" y2="120" stroke="#cdaa72" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="16" y="586" class="mono" fill="#a29d92">Panel opens on selection · FONC-270 / FONC-280</text>

  <!-- Panel -->
  <rect x="320" y="40" width="408" height="520" rx="10" class="card"/>
  <text x="340" y="72" class="eyebrow">SELECTED FOSSIL OCCURRENCE</text>
  <text x="708" y="74" class="lbl" text-anchor="end">✕</text>
  <line x1="340" y1="84" x2="708" y2="84" stroke="#e4e1d8"/>

  <text x="340" y="110" class="eyebrow">ASSOCIATED TAXON</text>
  <text x="708" y="110" class="mono" text-anchor="end">FONC-290</text>
  <text x="340" y="132" font-size="16" font-style="italic" font-weight="700" fill="#b07a35">Allosaurus fragilis</text>
  <text x="708" y="132" class="mono" text-anchor="end">FONC-990 · FONC-1070</text>
  <rect x="340" y="146" width="200" height="32" rx="6" class="accfill"/>
  <text x="356" y="167" fill="#ffffff" font-size="12.5" font-weight="700">Open taxon profile  →</text>
  <text x="556" y="167" class="lbl" font-size="11">≤ 2 actions from map</text>

  <line x1="340" y1="196" x2="708" y2="196" stroke="#e4e1d8"/>

  <text x="340" y="220" class="eyebrow">TIME RANGE</text>
  <text x="708" y="220" class="mono" text-anchor="end">FONC-920</text>
  <text x="340" y="242" class="val">153–150 Ma · Late Jurassic</text>
  <rect x="560" y="228" width="118" height="20" rx="10" class="badge"/>
  <text x="619" y="242" class="acctxt" font-size="10.5" text-anchor="middle">≈ approximate</text>

  <text x="340" y="278" class="eyebrow">MODERN LOCATION</text>
  <text x="708" y="278" class="mono" text-anchor="end">FONC-900 · CONS-110</text>
  <text x="340" y="300" class="val">Morrison Formation — Utah, USA</text>

  <text x="340" y="336" class="eyebrow">PALEOGEOGRAPHIC POSITION</text>
  <text x="708" y="336" class="mono" text-anchor="end">FONC-910 · FONC-1130</text>
  <text x="340" y="358" class="val">Western Laurasia</text>
  <rect x="560" y="344" width="118" height="20" rx="10" class="badge"/>
  <text x="619" y="358" class="acctxt" font-size="10.5" text-anchor="middle">▲ reconstructed</text>

  <text x="340" y="394" class="eyebrow">SOURCE</text>
  <text x="708" y="394" class="mono" text-anchor="end">FONC-930 · FONC-1100</text>
  <text x="340" y="416" class="val">Paleobiology Database</text>
  <rect x="560" y="402" width="118" height="20" rx="10" class="chip"/>
  <text x="619" y="416" class="lbl" font-size="10.5" text-anchor="middle">Database</text>

  <!-- disclaimer -->
  <rect x="340" y="440" width="368" height="70" rx="8" class="badge"/>
  <text x="356" y="466" class="acctxt" font-size="12">▲ Fossil discovery evidence</text>
  <text x="356" y="486" class="lbl" font-size="11.5">This point marks where a fossil was found — not a</text>
  <text x="356" y="502" class="lbl" font-size="11.5">distribution range or exact position where it lived.</text>
  <text x="692" y="530" class="mono" text-anchor="end">FONC-1150 · CONS-130 · CONS-140</text>

  <text x="340" y="552" class="mono" fill="#a29d92">Low-fidelity wireframe — layout &amp; required content only.</text>
</svg>

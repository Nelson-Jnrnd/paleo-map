name: ci

# Build/typecheck/test for the data layer (SPEC-001, SPEC-002 REQ-007/008/010).
# The governance workflow remains separate (docs/spec checks).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  data-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit / integration tests
        run: pnpm test
